[package]
name = "harmony"
version = "1.1.0"
edition = "2021"
authors = ["Xiangyan Liu <xyliugo@example.com>"]
description = "Harmony encoding library with MetaSep support and thread-safe concurrent access"
license = "MIT"
repository = "https://github.com/xyliugo/harmony"
readme = "README.md"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
thread-safe = []
offline-loading = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
